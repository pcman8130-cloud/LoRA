[project]
name = "day-20261112"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pcman8130-cloud", email = "pcman8130@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [ 
  "langchain-ollama",
  "torch>=2.6,<3",
  "transformers>=4.57,<5",
  "peft>=0.17,<0.19",
  "accelerate>=1.10,<2"
  ]

[project.scripts]
day-20261112 = "day_20261112:main"
ex01 = "ex01:main"
ex02 = "ex02:main"
ex03 = "ex03:main"
ex04 = "ex04:main"
ex05 = "ex05:main"
ex06 = "ex06:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

# CUDA용 PyTorch 설치 파일의 저장소. cu128은 CUDA 12.8용 예시이며 환경 기준표에 맞춘다.
# explicit은 아래 sources에서 지정한 패키지에만 이 저장소를 쓰게 한다.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Windows·Linux의 torch에 적용한다. macOS는 PyPI 패키지를 쓰며 실행 시 MPS/CPU를 선택한다.
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]